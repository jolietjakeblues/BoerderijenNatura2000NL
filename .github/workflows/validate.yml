name: Valideer data en gegenereerde pagina's

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Zelftest bbox-regex.mjs
        run: node scripts/lib/bbox-regex.mjs

      - name: Unittests scripts/lib/ (gedrag van hulpfuncties, niet alleen gegenereerde diffs)
        run: node --test scripts/lib/*.test.mjs

      - name: Valideer data.json-bestanden (schema en telinvarianten)
        run: node scripts/validate.mjs

      - name: Herbouw alle gebiedspagina's en de landingspagina uit de huidige data
        run: |
          for dir in data/gebieden/*/; do
            slug=$(basename "$dir")
            node scripts/06-build-gebied-html.mjs "$slug"
          done
          node scripts/07-build-landing-html.mjs

      - name: Controleer dat herbouwen geen verschil oplevert (data en HTML mogen niet uit elkaar lopen)
        run: |
          if ! git diff --quiet -- gebieden/ index.html; then
            echo "::error::Opnieuw genereren van de HTML uit data/gebieden/*/data.json geeft een ander resultaat dan wat gecommit is."
            git diff --stat -- gebieden/ index.html
            exit 1
          fi
